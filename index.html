<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Me desculpa Lucas</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      background-color: #000000;
      touch-action: manipulation;
    }

    .app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      isolation: isolate;
      overflow: hidden;
    }

    /* Imagem de fundo */
    .flower-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
      z-index: -3;
      transform: scale(1.04);
    }

    /* Overlay escuro de fundo */
    .scene-overlay {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.88), rgba(15, 15, 15, 0.72));
    }

    .glow {
      position: absolute;
      width: 32rem;
      height: 32rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      filter: blur(100px);
      z-index: -1;
      right: -10rem;
      top: -10rem;
    }

    /* Container principal */
    .content-container {
      width: min(100%, 440px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 1;
      animation: arrive 800ms cubic-bezier(.2,.8,.2,1) both;
    }

    .title {
      margin: 0 0 1rem;
      font-size: 2.2rem;
      line-height: 1.2;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    .message {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
      letter-spacing: -0.01em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }

    .fine-line {
      width: 45px;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      margin: 2rem auto;
      border-radius: 2px;
    }

    /* Card estilo Notificação iOS */
    .ios-notification-panel {
      width: 100%;
      position: relative;
      z-index: 1;
      padding: 1.6rem 1.4rem;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(30, 30, 30, 0.45);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
    }

    .question {
      margin: 0 0 1.25rem;
      font-size: 1.35rem;
      color: #ffffff;
      text-align: center;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    /* Botões perfeitamente centralizados */
    .answers {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
      width: 100%;
    }

    .answer-button {
      min-height: 48px;
      padding: 0.75rem 1.8rem;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      user-select: none;
    }

    #yes-action {
      background: rgba(255, 255, 255, 0.95);
      color: #000000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 180ms ease, background 180ms ease;
    }

    #yes-action:hover {
      transform: translateY(-2px);
      background: #ffffff;
    }

    /* Transição suave do botão NÃO pelo transform */
    #no-action {
      position: relative;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 999;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
    }

    .response-state {
      display: none;
      text-align: center;
      padding: 0.2rem 0;
      animation: reveal 380ms ease both;
    }

    .response-state.is-active { display: block; }
    .question-state.is-hidden { display: none; }

    .response-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 0.8rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .response-title {
      margin: 0 0 0.55rem;
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.015em;
    }

    .response-text {
      margin: 0 auto;
      font-size: 0.95rem;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 400;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <main class="app-shell" aria-label="Pedido de desculpas">
    <!-- Imagem de fundo -->
    <img class="flower-scene" src="lirio.jpg" alt="Lírio de fundo">
    <div class="scene-overlay" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>

    <div class="content-container">

      <h1 class="title">Oi Lucas</h1>
      
      <p class="message">
        Gastei horas do meu dia fazendo um website pra você ver o quanto eu me importo. É o que dizem "a gente só da valor quando perde", e eu tenho medo de ter percebido isso tarde demais. Queria poder refazer tudo diferente.
      </p>

      <div class="fine-line" aria-hidden="true"></div>

      <!-- Card Notificação iOS -->
      <div class="ios-notification-panel">
        
        <!-- Estado Inicial: Pergunta -->
        <div id="question-state" class="question-state">
          <h2 class="question">Me perdoa?</h2>
          <div class="answers">
            <button id="yes-action" class="answer-button" type="button">SIM</button>
            <button id="no-action" class="answer-button" type="button">NÃO</button>
          </div>
        </div>

        <!-- Estado ao Clicar SIM -->
        <div id="yes-state" class="response-state" aria-live="polite">
          <div class="response-icon" aria-hidden="true">
            <i data-lucide="heart-handshake" width="28" height="28"></i>
          </div>
          <h2 class="response-title">ebaaa</h2>
          <p class="response-text">
            Juro que agora sou outro!
          </p>
        </div>

      </div>

    </div>
  </main>

  <script>
    const questionState = document.getElementById("question-state");
    const yesState = document.getElementById("yes-state");
    const yesBtn = document.getElementById("yes-action");
    const noBtn = document.getElementById("no-action");

    function moveButton(e) {
      if (e) e.preventDefault();

      const rect = noBtn.getBoundingClientRect();
      const padding = 20;

      // Descobre a posição original do botão sem transformações
      const originalX = rect.left - (parseFloat(noBtn.dataset.tx) || 0);
      const originalY = rect.top - (parseFloat(noBtn.dataset.ty) || 0);

      // Limites visíveis reais da janela
      const minX = padding;
      const minY = padding;
      const maxX = window.innerWidth - rect.width - padding;
      const maxY = window.innerHeight - rect.height - padding;

      // Sorteia uma coordenada na tela
      const targetX = Math.floor(Math.random() * (maxX - minX)) + minX;
      const targetY = Math.floor(Math.random() * (maxY - minY)) + minY;

      // Calcula a diferença relativa a partir da posição inicial
      const deltaX = targetX - originalX;
      const deltaY = targetY - originalY;

      noBtn.dataset.tx = deltaX;
      noBtn.dataset.ty = deltaY;

      noBtn.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
    }

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", moveButton, { passive: false });
    noBtn.addEventListener("click", moveButton);

    yesBtn.addEventListener("click", () => {
      questionState.classList.add("is-hidden");
      yesState.classList.add("is-active");
      noBtn.style.display = "none";
    });

    lucide.createIcons();
  </script>

</body>
</html>
