<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Me desculpa Lucas</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      background-color: #000000;
      touch-action: manipulation;
    }

    .app-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      isolation: isolate;
      overflow: hidden;
    }

    /* Imagem de fundo */
    .flower-scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
      z-index: -3;
      transform: scale(1.04);
    }

    /* Overlay escuro de fundo */
    .scene-overlay {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.88), rgba(15, 15, 15, 0.72));
    }

    .glow {
      position: absolute;
      width: 32rem;
      height: 32rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      filter: blur(100px);
      z-index: -1;
      right: -10rem;
      top: -10rem;
    }

    /* Container principal */
    .content-container {
      width: min(100%, 440px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 1;
      animation: arrive 800ms cubic-bezier(.2,.8,.2,1) both;
    }

    .title {
      margin: 0 0 1rem;
      font-size: 2.2rem;
      line-height: 1.2;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    .message {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
      letter-spacing: -0.01em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    }

    .fine-line {
      width: 45px;
      height: 2px;
      background: rgba(255, 255, 255, 0.25);
      margin: 2rem auto;
      border-radius: 2px;
    }

    /* Card estilo Notificação iOS */
    .ios-notification-panel {
      width: 100%;
      position: relative;
      z-index: 1;
      padding: 1.6rem 1.4rem;
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(30, 30, 30, 0.45);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
    }

    .question {
      margin: 0 0 1.25rem;
      font-size: 1.35rem;
      color: #ffffff;
      text-align: center;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    /* Área dos botões com posicionamento relativo para travar a fuga dentro dela */
    .answers {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      position: relative;
      min-height: 100px; /* Altura garantida para movimentação interna */
      width: 100%;
    }

    .answer-button {
      min-height: 48px;
      padding: 0.75rem 1.8rem;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      user-select: none;
    }

    #yes-action {
      background: rgba(255, 255, 255, 0.95);
      color: #000000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 180ms ease, background 180ms ease;
    }

    #yes-action:hover {
      transform: translateY(-2px);
      background: #ffffff;
    }

    /* O botão NÃO fica posicionado de forma absoluta DENTRO da div .answers */
    #no-action {
      position: absolute;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 10;
      transition: left 0.15s ease-out, top 0.15s ease-out;
    }

    .response-state {
      display: none;
      text-align: center;
      padding: 0.2rem 0;
      animation: reveal 380ms ease both;
    }

    .response-state.is-active { display: block; }
    .question-state.is-hidden { display: none; }

    .response-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 0.8rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .response-title {
      margin: 0 0 0.55rem;
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.015em;
    }

    .response-text {
      margin: 0 auto;
      font-size: 0.95rem;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 400;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <main class="app-shell" aria-label="Pedido de desculpas">
    <!-- Imagem de fundo -->
    <img class="flower-scene" src="lirio.jpg" alt="Lírio de fundo">
    <div class="scene-overlay" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>

    <div class="content-container">

      <h1 class="title">Me desculpa Lucas</h1>
      
      <p class="message">
        Eu sei que errei e queria te pedir desculpas de coração. Me arrependo do que aconteceu e queria ter feito diferente. Você é muito importante para mim e eu queria uma chance de consertar isso.
      </p>

      <div class="fine-line" aria-hidden="true"></div>

      <!-- Card Notificação iOS -->
      <div class="ios-notification-panel">
        
        <!-- Estado Inicial: Pergunta -->
        <div id="question-state" class="question-state">
          <h2 class="question">Você me perdoa?</h2>
          <div class="answers" id="answers-container">
            <button id="yes-action" class="answer-button" type="button">SIM</button>
            <button id="no-action" class="answer-button" type="button">NÃO</button>
          </div>
        </div>

        <!-- Estado ao Clicar SIM -->
        <div id="yes-state" class="response-state" aria-live="polite">
          <div class="response-icon" aria-hidden="true">
            <i data-lucide="heart-handshake" width="28" height="28"></i>
          </div>
          <h2 class="response-title">Obrigado</h2>
          <p class="response-text">
            Eu prometo fazer o possível para merecer esse perdão!!!
          </p>
        </div>

      </div>

    </div>
  </main>

  <script>
    const questionState = document.getElementById("question-state");
    const yesState = document.getElementById("yes-state");
    const yesBtn = document.getElementById("yes-action");
    const noBtn = document.getElementById("no-action");
    const container = document.getElementById("answers-container");

    // Posiciona o botão "NÃO" ao lado direito do "SIM" no carregamento inicial
    function initNoButtonPosition() {
      const yesRect = yesBtn.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();
      
      const leftOffset = (yesRect.right - containerRect.left) + 16;
      const topOffset = (yesRect.top - containerRect.top);
      
      noBtn.style.left = `${leftOffset}px`;
      noBtn.style.top = `${topOffset}px`;
    }

    function moveButton(e) {
      if (e) e.preventDefault();

      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;
      const btnWidth = noBtn.offsetWidth || 80;
      const btnHeight = noBtn.offsetHeight || 44;

      // Limites estritos dentro do container de respostas
      const maxX = containerWidth - btnWidth;
      const maxY = containerHeight - btnHeight;

      // Sorteia nova posição dentro da caixa do card
      const newX = Math.max(0, Math.floor(Math.random() * maxX));
      const newY = Math.max(0, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
    }

    window.addEventListener("load", initNoButtonPosition);
    window.addEventListener("resize", initNoButtonPosition);

    noBtn.addEventListener("mouseover", moveButton);
    noBtn.addEventListener("touchstart", moveButton, { passive: false });
    noBtn.addEventListener("click", moveButton);

    yesBtn.addEventListener("click", () => {
      questionState.classList.add("is-hidden");
      yesState.classList.add("is-active");
      noBtn.style.display = "none";
    });

    lucide.createIcons();
  </script>

</body>
</html>
