<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Me desculpa Lucas</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;

      /* IMAGEM DE FUNDO */
      background: url('fundo.jpg') center center / cover no-repeat;
    }

    /* Moldura xadrez azul escuro */
    .frame {
      padding: 16px;
      border-radius: 34px;
      background-color: #3b5f9c;
      background-image:
        linear-gradient(90deg, rgba(255,255,255,0.12) 50%, transparent 50%),
        linear-gradient(rgba(255,255,255,0.08) 50%, transparent 50%),
        linear-gradient(90deg, rgba(18,42,84,0.22) 50%, transparent 50%),
        linear-gradient(rgba(18,42,84,0.22) 50%, transparent 50%);
      background-size: 60px 60px, 60px 60px, 15px 15px, 15px 15px;
      background-position: 0 0, 30px 30px, 0 0, 8px 8px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.28);
    }

    .card {
      width: 90%;
      max-width: 560px;
      background: rgba(255,255,255,0.97);
      border-radius: 22px;
      padding: 34px 30px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .emoji {
      font-size: 52px;
      margin-bottom: 8px;
    }

    h1 {
      color: #2458b8;
      font-size: 32px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    p {
      font-size: 16px;
      color: #4a5568;
      line-height: 1.5;
      margin-bottom: 10px;
      font-weight: 400;
    }

    h2 {
      margin-top: 18px;
      margin-bottom: 18px;
      color: #1f4aa8;
      font-size: 25px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      position: relative;
      min-height: 64px;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 14px 34px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 14px;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    #yesBtn {
      background: #2563eb;
      color: white;
      box-shadow: 0 8px 18px rgba(37,99,235,0.28);
    }

    #yesBtn:hover {
      transform: scale(1.05);
      background: #1d4ed8;
    }

    #noBtn {
      background: white;
      color: #1f4aa8;
      border: 2px solid #9ec5ff;
      position: static;
    }

    #message {
      margin-top: 18px;
      font-size: 18px;
      color: #2458b8;
      font-weight: 600;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .frame {
        padding: 12px;
      }

      .card {
        padding: 28px 22px;
      }

      h1 {
        font-size: 28px;
      }

      p {
        font-size: 15px;
      }

      h2 {
        font-size: 22px;
      }

      button {
        padding: 13px 24px;
        font-size: 17px;
      }
    }
  </style>

</head>

<body>

  <div class="frame">
    <div class="card">
      <div class="emoji">🥺</div>

```
  <h1>Me desculpa Lucas</h1>

  <p>Eu sei que errei e queria te pedir desculpas de coração. Me arrependo do que aconteceu e queria ter feito diferente. Você é muito importante para mim e eu queria uma chance de consertar isso.</p>

  <h2>Você me perdoa?</h2>

  <div class="buttons">
    <button id="yesBtn">SIM</button>
    <button id="noBtn">NÃO</button>
  </div>

  <div id="message">
    Eu prometo fazer o possível para merecer esse perdão!!!
  </div>
</div>
```

  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const message = document.getElementById("message");

    let escaped = false;

    function moveButton() {
      if (!escaped) {
        escaped = true;
        noBtn.style.position = "fixed";
      }

      const margin = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - margin;
      const maxY = window.innerHeight - noBtn.offsetHeight - margin;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseenter", moveButton);

    noBtn.addEventListener("touchstart", function(e) {
      e.preventDefault();
      moveButton();
    });

    yesBtn.addEventListener("click", function() {
      message.style.display = "block";
      yesBtn.textContent = "❤️ Obrigado ❤️";
    });
  </script>

</body>
</html>
