<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: #0077ff;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
    }

    a:hover {
      background: #005ecc;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Olá, eu sou Samuel</h1>
  <p>Essa é minha primeira página publicada gratuitamente no GitHub Pages.</p>

  <a href="https://www.instagram.com" target="_blank">
    Meu Instagram
  </a>
</div>

</body>
</html>
